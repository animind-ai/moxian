name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (CJK font, LaTeX + dvisvgm, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm ffmpeg \
            libegl1 libgl1  # skia-python 导入时需要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uvx ruff check .
      - run: uv run pytest -q
      - run: uv run python examples/first_frame.py
